<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M6 - Gerador de Placas</title>

<style>

@page{
    size:A4 landscape;
    margin:0;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{

    width:100%;
    height:100%;

    font-family:Arial, Helvetica, sans-serif;
    background:#efefef;

}

/* =======================================================
   PAINEL SUPERIOR
======================================================= */

#painel{

    width:100%;

    background:white;

    padding:15px;

    display:flex;
    flex-direction:column;
    gap:10px;

    box-shadow:0 2px 8px rgba(0,0,0,.12);

}

label{

    font-weight:bold;
    font-size:16px;

}

textarea{

    width:100%;
    height:90px;

    resize:vertical;

    padding:10px;

    font-size:22px;

    font-family:Arial, Helvetica, sans-serif;

}

#botoes{

    display:flex;
    gap:10px;

}

button{

    padding:10px 18px;

    font-size:16px;

    cursor:pointer;

}

/* =======================================================
   PÁGINA A4
======================================================= */

#pagina{

    width:297mm;
    height:210mm;

    margin:20px auto;

    background:white;

    display:flex;

    justify-content:center;
    align-items:center;

    overflow:hidden;

    box-shadow:0 0 12px rgba(0,0,0,.18);

}

/* =======================================================
   ÁREA DA PLACA
======================================================= */

#placa{

    width:92%;
    height:88%;

    display:flex;

    justify-content:center;
    align-items:center;

    text-align:center;

    font-weight:bold;

    line-height:1.08;

    padding:10mm;

    /*
      Nunca cortar palavras.
      Apenas quebrar entre palavras.
    */

    white-space:pre-wrap;

    word-break:normal;

    overflow-wrap:normal;

    user-select:none;

}
@media print{

    html,
    body{

        width:100%;
        height:100%;

        background:white;

    }

    #painel{

        display:none;

    }

    #pagina{

        margin:0;

        width:297mm;
        height:210mm;

        box-shadow:none;

    }

}

</style>

</head>

<body>

<div id="painel">

    <label for="texto">
        Texto da placa
    </label>

    <textarea
        id="texto"
        spellcheck="false"
        placeholder="Digite aqui o texto da placa...">DEVOLUÇÕES</textarea>

    <div id="botoes">

        <button id="btnCentralizar">
            Atualizar
        </button>

        <button id="btnImprimir">
            🖨 Imprimir
        </button>

    </div>

</div>

<div id="pagina">

    <div id="placa">

        DEVOLUÇÕES

    </div>

</div>

<script>

const texto = document.getElementById("texto");
const placa = document.getElementById("placa");

const btnAtualizar =
document.getElementById("btnCentralizar");

const btnImprimir =
document.getElementById("btnImprimir");
/* ======================================================
   Atualiza o texto da placa
====================================================== */

function atualizarTexto(){

    let valor = texto.value.trim();

    if(valor === ""){
        valor = " ";
    }

    placa.textContent = valor;

    ajustarFonte();

}

/* ======================================================
   Ajusta automaticamente o maior tamanho de fonte
====================================================== */

function ajustarFonte(){

    let minimo = 10;
    let maximo = 600;
    let melhor = minimo;

    while(minimo <= maximo){

        const meio = Math.floor((minimo + maximo) / 2);

        placa.style.fontSize = meio + "px";

        /*
            Se couber na área disponível,
            tentamos aumentar.
        */

        if(

            placa.scrollWidth <= placa.clientWidth &&
            placa.scrollHeight <= placa.clientHeight

        ){

            melhor = meio;
            minimo = meio + 1;

        }

        /*
            Não coube.
            Diminuímos.
        */

        else{

            maximo = meio - 1;

        }

    }

    placa.style.fontSize = melhor + "px";

}

/* ======================================================
   Eventos
====================================================== */

btnAtualizar.addEventListener("click", atualizarTexto);

texto.addEventListener("input", atualizarTexto);

window.addEventListener("resize", ajustarFonte);

window.addEventListener("load", atualizarTexto);

/* ======================================================
   Impressão
====================================================== */

btnImprimir.addEventListener("click", () => {

    atualizarTexto();

    setTimeout(() => {

        window.print();

    },100);

});

</script>
    
</body>
</html>
